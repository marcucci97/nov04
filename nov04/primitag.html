<!doctype html> <!-- dichiarazione della versione html5 -->
<html> <!-- inizio codice html -->
<head> <!-- inizio parte logica della pagina -->
	<meta charset="utf-8" />  <!-- dichiarazione del set di caratteri -->
	<title>Prima pagina HTML</title> <!-- titolo della pagina -->
</head> 
<body> <!-- inizio parte fisica della pagina -->
	Benvenuti nella mia prima <em>pagina web!</em> <br />  <!-- br x andare a capo invece em per corsivo -->
	<strong>Chiara Marcucci</strong> <!-- strong per grassetto,(è preferibile usarlo massimo 5 volte nella crezione di una pagina ed il resto usare B di bold per un discorso di blocco della pubblicità gratuita da parte di internet), eu per sottolineato, strike per barrato -->
</body>
</html> <!-- fine codice html -->
